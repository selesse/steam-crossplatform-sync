name: Web frontend

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@v7

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # Biome: lint, formatting and import order.
    - name: Lint
      run: bun run lint

    # Type-checks, then builds the bundle.
    - name: Build
      run: bun run build
