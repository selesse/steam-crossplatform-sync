plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.3.0'
    id 'com.selesse.daemon-app' version '0.5.0'
}

dependencies {
    implementation("tools.jackson.dataformat:jackson-dataformat-yaml:3.0.3")
    implementation("org.xerial:sqlite-jdbc:3.51.1.0")
    implementation(project(':steam-config-reader'))
    implementation(project(':common'))
    implementation(project(':game-session-tracker'))
}

application {
    mainClass = 'com.selesse.steam.crossplatform.sync.App'
}

daemonApp {
    serviceId = 'com.selesse.steam-crossplatform-sync'
    jarTask = tasks.shadowJar
}

