plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.3.0'
    id 'com.selesse.daemon-app' version '0.7.0'
    id 'org.beryx.jlink' version '4.1.0'
}

dependencies {
    implementation("tools.jackson.dataformat:jackson-dataformat-yaml:3.0.3")
    implementation("org.xerial:sqlite-jdbc:3.51.1.0")
    implementation(project(':steam-config-reader'))
    implementation(project(':common'))
    implementation(project(':game-session-tracker'))
}

application {
    mainModule = 'com.selesse.steam.crossplatform.sync'
    mainClass = 'com.selesse.steam.crossplatform.sync.App'
}

jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'steam-crossplatform-sync'
    }
    // flyway-core (merged as a non-modular jar) references org.slf4j.Logger reflectively, so the
    // generated merged module-info requires it - but the plugin's own dependency-copy step misses it.
    addExtraDependencies('slf4j-api')
}

daemonApp {
    serviceId = 'com.selesse.steam-crossplatform-sync'
    jarTask = tasks.shadowJar
}

// Flyway finds migrations by scanning a classpath, and a jlink image has none. Nothing running
// from a classpath - which is every test - can catch that, so this runs a real migration inside
// the image.
sourceSets {
    jlinkSmokeTest {}
}

dependencies {
    jlinkSmokeTestImplementation(project(':game-session-tracker'))
}

// Deliberately not wired into `check`: building the image costs more than the whole test suite,
// and what it guards is packaging config that rarely moves. CI runs it as its own step; run it by
// hand when touching the jlink block.
tasks.register('verifyJlinkMigrations', Exec) {
    group = 'verification'
    description = 'Migrates a fresh database inside the jlink image to prove Flyway still finds its scripts.'
    dependsOn tasks.jlink, tasks.named('jlinkSmokeTestClasses')

    def windows = System.getProperty('os.name', '').toLowerCase().contains('windows')
    def launcher = layout.buildDirectory.file('image/bin/' + (windows ? 'java.exe' : 'java'))
    def dataDirectory = layout.buildDirectory.dir('jlink-smoke-test')
    def probeClasses = sourceSets.jlinkSmokeTest.output.classesDirs

    doFirst {
        delete dataDirectory
        mkdir dataDirectory
    }

    executable = launcher.get().asFile.absolutePath
    argumentProviders.add({
        [
            '--add-modules', 'com.selesse.steamcrossplatformsync.gamesessions',
            '-cp', probeClasses.asPath,
            'com.selesse.steam.crossplatform.sync.jlink.JlinkMigrationSmokeTest',
            dataDirectory.get().asFile.absolutePath,
        ]
    } as CommandLineArgumentProvider)
}

